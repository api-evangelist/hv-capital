aid: hv-capital
name: HV Capital
description: >-
  HV Capital is one of Europe's leading early-stage and growth venture capital
  firms, headquartered in Munich with an office in Berlin. Founded in 2000 as
  Holtzbrinck Ventures (the venture arm associated with Verlagsgruppe Georg von
  Holtzbrinck), the partnership completed a management buyout and rebranded to
  HV Capital in 2018, establishing full operational and investment
  independence. The firm backs European founders with global ambitions across
  the full lifecycle: its Venture fund writes seed and Series A checks from
  roughly €500K to €10M, while its Growth fund invests through Series B and
  beyond with checks up to €60M and follow-on reserves reaching €100M per
  company. HV invests across consumer internet, enterprise software and SaaS,
  fintech, deep tech, healthcare, climate and energy, cybersecurity, and AI. The
  firm reports more than €2.8B in assets under management across nine fund
  generations spanning Venture and Growth, over 290 portfolio companies, and 12
  IPOs. Its investment philosophy — "too new is our baseline, too bold is our
  reason, too complex is our edge" — reflects a willingness to back complex,
  category-defining companies. Early and notable investments include Zalando,
  Delivery Hero, FlixBus, SumUp, Depop, Scalable Capital, Enpal, and Isar
  Aerospace. This profile tracks HV Capital's identity and its portfolio graph
  across the API Evangelist network.
